# promtool test rules sick-alerts.test.yml
#
# Synthetic series for every alert of sick-alerts.yml, each with a case
# that fires and one that does not. promtool starts the clock at 0, so
# time() is the evaluation time in seconds.

rule_files:
  - sick-alerts.yml

evaluation_interval: 1m

tests:
  # renew_before 10 days (864000 s) for every device
  - interval: 1m
    input_series:
      - series: 'sick_device_renew_before_seconds{device="fine"}'
        values: '864000x120'
      - series: 'sick_device_renew_before_seconds{device="late"}'
        values: '864000x120'
      - series: 'sick_device_renew_before_seconds{device="critical"}'
        values: '864000x120'
      # 6 days left: inside renew_before, sick run is due, nothing alerts yet
      - series: 'sick_certificate_remaining_seconds{device="fine"}'
        values: '518400x120'
      # 4 days left: below half of renew_before
      - series: 'sick_certificate_remaining_seconds{device="late"}'
        values: '345600x120'
      # 2 days left: below a quarter
      - series: 'sick_certificate_remaining_seconds{device="critical"}'
        values: '172800x120'
      - series: 'sick_device_matches_last_issue{device="fine"}'
        values: '1x120'
      - series: 'sick_device_matches_last_issue{device="stale"}'
        values: '0x120'
      - series: 'sick_device_consecutive_failures{device="fine"}'
        values: '2x120'
      - series: 'sick_device_consecutive_failures{device="failing"}'
        values: '3x120'
      - series: 'sick_ca_up'
        values: '0x120'
      - series: 'sick_ca_certificate_not_after_seconds{role="intermediate",subject="CN=Example Intermediate CA"}'
        values: '31535000x120'
      - series: 'sick_ca_certificate_not_after_seconds{role="intermediate",subject="CN=Example Next Intermediate CA"}'
        values: '94608000x120'
      - series: 'sick_ca_certificate_not_after_seconds{role="root",subject="CN=Example Root CA"}'
        values: '63000000x120'
      - series: 'sick_ca_certificate_not_after_seconds{role="root",subject="CN=Example Next Root CA"}'
        values: '315360000x120'
    alert_rule_test:
      - eval_time: 5m
        alertname: SickRenewalLate
        exp_alerts:
          - exp_labels: { severity: warning, device: late }
            exp_annotations:
              summary: "late: certificate not renewed, half of renew_before is used up"
          - exp_labels: { severity: warning, device: critical }
            exp_annotations:
              summary: "critical: certificate not renewed, half of renew_before is used up"
      - eval_time: 5m
        alertname: SickCertificateExpiring
        exp_alerts:
          - exp_labels: { severity: critical, device: critical }
            exp_annotations:
              summary: "critical: certificate expires soon, a quarter of renew_before is left"
      - eval_time: 30m
        alertname: SickDeviceStale
        exp_alerts: []
      - eval_time: 61m
        alertname: SickDeviceStale
        exp_alerts:
          - exp_labels: { severity: warning, device: stale }
            exp_annotations:
              summary: "stale: does not present the certificate issued for it last"
      - eval_time: 5m
        alertname: SickDeviceFailing
        exp_alerts:
          - exp_labels: { severity: warning, device: failing }
            exp_annotations:
              summary: "failing: 3 attempts to renew failed in a row"
      - eval_time: 20m
        alertname: SickCAUnreachable
        exp_alerts: []
      - eval_time: 31m
        alertname: SickCAUnreachable
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "the CA does not answer its health check"
      - eval_time: 5m
        alertname: SickIntermediateExpiring
        exp_alerts:
          - exp_labels: { severity: warning, role: intermediate, subject: "CN=Example Intermediate CA" }
            exp_annotations:
              summary: "intermediate CN=Example Intermediate CA expires within a year"
      - eval_time: 5m
        alertname: SickRootExpiring
        exp_alerts:
          - exp_labels: { severity: warning, role: root, subject: "CN=Example Root CA" }
            exp_annotations:
              summary: "root CN=Example Root CA expires within two years"

  # a day and more; sampled every minute like the rest - with hourly samples
  # the series would be stale between them and "for" would start over
  - interval: 1m
    input_series:
      - series: 'sick_device_reachable{device="up"}'
        values: '1x1600'
      - series: 'sick_device_reachable{device="gone"}'
        values: '0x1600'
      - series: 'sick_check_timestamp_seconds'
        values: '0x3000'
    alert_rule_test:
      - eval_time: 12h
        alertname: SickDeviceUnreachable
        exp_alerts: []
      - eval_time: 25h
        alertname: SickDeviceUnreachable
        exp_alerts:
          - exp_labels: { severity: warning, device: gone }
            exp_annotations:
              summary: "gone: has not answered for a day"
      - eval_time: 47h
        alertname: SickCheckStale
        exp_alerts: []
      - eval_time: 49h
        alertname: SickCheckStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "sick check has not written its metrics for two days"
