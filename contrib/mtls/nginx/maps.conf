# Who a client certificate is, and whether it may in: shared by mtls.conf
# and proxy.conf. In the http context, before the server that uses it:
# conf.d/00-maps.conf (conf.d/*.conf is included in the order of the
# names). See README.md, "Identity to principal".
#
# The identity is the whole subject DN as nginx gives it (RFC 2253), not
# the SAN: nginx has no variable for the SAN. The provisioner "clients"
# makes the subject from the token alone - CN = the identity the admin
# enrolled, nothing else in the DN -, and enroll.sh issues the same identity
# as the only SAN. So "CN=person@example.internal" names exactly one holder.
#
# nginx compares map strings without regard to case: never enrol two
# identities that differ in case only.

map $ssl_client_s_dn $mtls_principal {
    default "";
    include /etc/nginx/mtls/principals.map;
}

# Single certificates that are refused although valid: a lost device, until
# its certificate expires. Hexadecimal serial as "openssl x509 -serial"
# prints it.
map $ssl_client_serial $mtls_revoked {
    default 0;
    include /etc/nginx/mtls/revoked-serials.map;
}

log_format mtls '$remote_addr "$request" $status verify=$ssl_client_verify '
                'dn="$ssl_client_s_dn" serial=$ssl_client_serial principal="$mtls_principal"';
