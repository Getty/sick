# The backend side of proxy.conf: a stand-in for the application. It takes
# X-Client-Identity from one peer only, the proxy, recognised by the
# proxy's client certificate - not by its address. Anybody else, with a
# certificate of the CA or without, does not get as far as the header.
# Here it answers with the identity it was told; your application reads
# the header the same way, behind a listener like this one.
#
# /etc/nginx/certs/:
#   server.crt, server.key   the backend's server certificate (serverAuth)
#   client-ca-bundle.pem     the trust set for client certificates

map $ssl_client_s_dn $from_proxy {
    default 0;
    "CN=proxy.machines.example.internal"    1;
}

server {
    listen 8443 ssl;
    server_name backend.example.internal;

    ssl_certificate        /etc/nginx/certs/server.crt;
    ssl_certificate_key    /etc/nginx/certs/server.key;
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/certs/client-ca-bundle.pem;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    access_log /var/log/nginx/access.log;

    location / {
        if ($from_proxy = 0) {
            return 403 "not the proxy\n";
        }
        default_type text/plain;
        return 200 "principal=$http_x_client_identity\n";
    }
}
