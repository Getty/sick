# A terminating proxy in front of an application that does not speak TLS
# with client certificates itself: nginx authenticates the client and
# decides who may in, as mtls.conf does, and tells the backend who it is in
# X-Client-Identity. See README.md, "Behind a terminating proxy".
#
# /etc/nginx/certs/:
#   server.crt, server.key   this proxy's server certificate (serverAuth)
#   client-ca-bundle.pem     the trust set for client certificates
#   proxy-client.crt, .key   the proxy's OWN client certificate (clientAuth,
#                            from "clients", an identity of its own): it
#                            authenticates the proxy to the backend
#   upstream-ca.pem          the root, to verify the backend's certificate

server {
    listen 443 ssl;
    server_name app.example.internal;

    ssl_certificate        /etc/nginx/certs/server.crt;
    ssl_certificate_key    /etc/nginx/certs/server.key;
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/certs/client-ca-bundle.pem;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    access_log /var/log/nginx/access.log mtls;

    location / {
        if ($mtls_revoked) {
            return 403 "revoked\n";
        }
        if ($mtls_principal = "") {
            return 403 "not allowed\n";
        }

        proxy_pass https://backend.example.internal:8443;

        # The identity header is SET by the proxy, which replaces every
        # X-Client-Identity the client sent: nginx passes no client header
        # of a name that proxy_set_header names.
        proxy_set_header X-Client-Identity $mtls_principal;
        proxy_set_header Host $host;

        # The hop to the backend: TLS, the backend's certificate verified
        # against the root and its name, and the proxy's own client
        # certificate - the backend believes the header from that
        # certificate only.
        proxy_ssl_certificate         /etc/nginx/certs/proxy-client.crt;
        proxy_ssl_certificate_key     /etc/nginx/certs/proxy-client.key;
        proxy_ssl_trusted_certificate /etc/nginx/certs/upstream-ca.pem;
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        2;
        proxy_ssl_name                backend.example.internal;
        proxy_ssl_server_name         on;
        proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    }
}
