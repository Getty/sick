# nginx itself is the application's door: TLS with client certificates,
# identity -> principal (maps.conf), 403 for whoever is not allowed. The
# location stands for your application; here it answers with the principal.
# See README.md.
#
# /etc/nginx/certs/ (from the admin, see README.md):
#   server.crt            this server's certificate and the intermediate
#   server.key            its key
#   client-ca-bundle.pem  the trust set for CLIENT certificates: root and
#                         intermediate of the internal CA - not this
#                         server's chain, even where it holds the same
#                         certificates today

server {
    listen 443 ssl;
    server_name mtls.example.internal;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A client has to present a certificate that leads to the root of this
    # file, with clientAuth among its purposes (a serverAuth-only leaf of the
    # same CA fails here), within its validity. The intermediate is in the
    # file so that a client may send its leaf alone. nginx completes the
    # handshake either way and answers 400 to a request without a good
    # certificate (internally 496 for none, 495 for a bad one).
    ssl_client_certificate /etc/nginx/certs/client-ca-bundle.pem;
    ssl_verify_client      on;
    # leaf - intermediate - root: one intermediate. Every additional level
    # has to be a decision.
    ssl_verify_depth       2;

    access_log /var/log/nginx/access.log mtls;

    location / {
        # Authenticated is not authorized: a valid certificate of the CA
        # whose subject is not in principals.map gets a 403.
        if ($mtls_revoked) {
            return 403 "revoked\n";
        }
        if ($mtls_principal = "") {
            return 403 "not allowed\n";
        }
        default_type text/plain;
        return 200 "principal=$mtls_principal\n";
    }
}
