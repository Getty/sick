# nginx (1.30) serving a certificate that acme.sh fetched from the ACME
# endpoint of step-ca. Replaces /etc/nginx/conf.d/default.conf. See
# README.md next to this file.

# Port 80: the http-01 challenge, answered from the directory acme.sh
# writes to (--webroot), and a redirect to https for everything else.
server {
    listen 80;
    server_name nginx.example.internal;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name nginx.example.internal;

    # Written by "acme.sh --install-cert" (acme-sidecar.sh), which reloads
    # nginx after every renewal. The first start, before there is a
    # certificate, serves a self-signed placeholder from the same files.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
        proxy_pass http://app:8080;
    }
}
