# For a lab: traefik beside the CA of docker/ on one Docker host, without
# internal DNS. Added on top of compose.yml:
#
#   docker compose -f contrib/acme/traefik/compose.yml \
#     -f contrib/acme/traefik/compose.lab.yml up -d
#
# Each compose.yml is a Compose project of its own, so traefik cannot resolve
# ca.example.internal and the CA cannot resolve traefik.example.internal for
# the challenge. This file joins traefik to the CA's network (an external
# network: the CA's project made it) under the alias traefik.example.internal;
# the CA has ca.example.internal there (SICK_CA_ALIAS in
# docker/compose.yml). In a real network internal DNS does both and
# this file is not needed.
#
#   SICK_LAB_NETWORK     the CA's Compose network        (sick_default:
#                        project "sick" of docker/compose.yml)
#   SICK_LAB_HTTP_PORT   port 80 of traefik on 127.0.0.1 of the host  (80)
#   SICK_LAB_HTTPS_PORT  port 443 of traefik on 127.0.0.1 of the host (443)
#
# The ports replace those of compose.yml (!override, Compose 2.24 or
# later): published on 127.0.0.1 only. The CA reaches traefik over the
# network, not through them.

services:
  traefik:
    ports: !override
      - "127.0.0.1:${SICK_LAB_HTTP_PORT:-80}:80"
      - "127.0.0.1:${SICK_LAB_HTTPS_PORT:-443}:443"
    networks:
      default: {}
      ca:
        aliases: [traefik.example.internal]

networks:
  ca:
    name: ${SICK_LAB_NETWORK:-sick_default}
    external: true
