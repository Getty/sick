# Proxmox VE and Proxmox Backup Server with the device types of
# SICK-Target-Proxmox (proxmox-ve, proxmox-bs; in the sick image since it
# carries that distribution). Entries for the device list of SICK; the ca:
# section at the top of the list is yours.
#
# The node's API is always verified: by the roots of SICK's CA (handed to
# the target by the run) once the node presents our certificate, and for the
# first upload by the node's own CA (`ca`, PVE: /etc/pve/pve-root-ca.pem) or a
# pin of its current certificate (`fingerprint`, a fresh PBS). There is no
# way to switch verification off.
#
# Each token secret is a file of its own, one line, mode 0600 (in the Docker
# setup: docker/secrets/, mounted at /etc/sick/secrets). It goes into the
# request header only, never into this list or a command line.
#
# Run end to end against real PVE 9.2.21 and PBS 4.2.8 in containers
# (../sick-target-proxmox, t/e2e/device-proxmox.sh).

devices:

  # One entry per PVE node: every node has its own certificate.
  pve1:
    type: proxmox-ve
    host: pve1.example.internal            # port 8006 by default
    names: [pve1.example.internal]
    node: pve1                             # the node name, as in the GUI
    token_id: sick@pve!sick
    token_file: /etc/sick/secrets/pve1.token
    ca: /etc/sick/secrets/pve-root-ca.pem  # the cluster CA, for the first upload

  # PBS has one certificate per host.
  pbs1:
    type: proxmox-bs
    host: pbs1.example.internal            # port 8007 by default
    names: [pbs1.example.internal]
    token_id: sick@pbs!sick
    token_file: /etc/sick/secrets/pbs1.token
    fingerprint: 'AB:CD:...:EF'            # SHA-256 of its current self-signed
                                           # certificate, taken on the host
