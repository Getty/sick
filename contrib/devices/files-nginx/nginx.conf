# nginx for the device "web" of compose.yml next to this file: mounted as
# /etc/nginx/web.conf. Runs as uid 101, group 0, on a read-only root file
# system: pid and temporary files in /tmp.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr notice;
events { worker_connections 64; }
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # a variable: the files are read at every handshake, not at the start
  map $ssl_server_name $web_dir { default /var/lib/sick/certs/web; }

  server {
    listen 443 ssl;
    server_name web.example.internal;
    # certificate and intermediate: a client with the root alone
    # cannot verify the certificate without the chain
    ssl_certificate     $web_dir/fullchain.pem;
    ssl_certificate_key $web_dir/key.pem;
    location / {
      default_type text/plain;
      return 200 "hello from web\n";
    }
  }
}
