# One HTTPS server with the certificate cert-manager keeps in the Secret
# mounted at /tls (tls.crt holds the leaf and the intermediate).
server {
    listen 8443 ssl;
    ssl_certificate     /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    location / {
        default_type text/plain;
        return 200 "$host\n";
    }
}
