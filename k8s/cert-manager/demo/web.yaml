    spec:
      containers:
        - name: nginx
          image: nginx:1.30.5-alpine
          command: [/bin/sh, /serve/serve.sh]
          ports:
            - { name: https, containerPort: 8443 }
          readinessProbe:
            tcpSocket: { port: https }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: serve, mountPath: /serve, readOnly: true }
            - { name: serve, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf, readOnly: true }
      volumes:
        - name: tls
