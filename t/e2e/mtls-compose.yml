# Added by t/e2e/mtls.sh to docker/compose.yml (with compose.import.yml,
# compose.provisioners.yml, t/e2e/compose.local.yml, compose.ceremony.yml)
# and contrib/mtls/compose.yml. The shipped files stay as they are. This one
#   - publishes no port (ports: !reset) and labels every container sick=1
#     (compose.local.yml labels the volumes and the network);
#   - pins the nginx image by digest;
#   - gives the three nginx services their names in example.internal on the
#     Compose network, the lab's DNS;
#   - mounts the configuration from contrib/mtls by absolute path: relative
#     paths of the contrib file would resolve against docker/, the directory
#     of the first file, so each volume list is replaced (!override) - the
#     same files, plus revoked-serials.map from the working directory, which
#     the script changes;
#   - adds "client" (curl, openssl, the NSS tools) on Debian, pinned.
#
# MTLS_REPO is this checkout, MTLS_WORK the private working directory (both
# set by mtls.sh).

x-nginx: &nginx
  image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
  labels: { sick: "1" }
  restart: "no"
  healthcheck:
    test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || nc -z 127.0.0.1 8443"]
    interval: 1s
    timeout: 3s
    retries: 30

services:

  mtls:
    <<: *nginx
    ports: !reset []
    volumes: !override
      - ${MTLS_REPO:?set by mtls.sh}/contrib/mtls/nginx/mtls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MTLS_REPO:?set by mtls.sh}/contrib/mtls/nginx/maps.conf:/etc/nginx/conf.d/00-maps.conf:ro
      - ${MTLS_REPO:?set by mtls.sh}/contrib/mtls/nginx/principals.map:/etc/nginx/mtls/principals.map:ro
      - ${MTLS_WORK:?set by mtls.sh}/maps/revoked-serials.map:/etc/nginx/mtls/revoked-serials.map:ro
      - ${MTLS_WORK:?set by mtls.sh}/nginx/mtls:/etc/nginx/certs:ro
    networks:
      default:
        aliases: [mtls.example.internal]

  proxy:
    <<: *nginx
    ports: !reset []
    volumes: !override
      - ${MTLS_REPO:?set by mtls.sh}/contrib/mtls/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MTLS_REPO:?set by mtls.sh}/contrib/mtls/nginx/maps.conf:/etc/nginx/conf.d/00-maps.conf:ro
      - ${MTLS_REPO:?set by mtls.sh}/contrib/mtls/nginx/principals.map:/etc/nginx/mtls/principals.map:ro
      - ${MTLS_REPO:?set by mtls.sh}/contrib/mtls/nginx/revoked-serials.map:/etc/nginx/mtls/revoked-serials.map:ro
      - ${MTLS_WORK:?set by mtls.sh}/nginx/proxy:/etc/nginx/certs:ro
    networks:
      default:
        aliases: [app.example.internal]

  backend:
    <<: *nginx
    volumes: !override
      - ${MTLS_REPO:?set by mtls.sh}/contrib/mtls/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MTLS_WORK:?set by mtls.sh}/nginx/backend:/etc/nginx/certs:ro

  client:
    image: debian:trixie-20261005-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    labels: { sick: "1" }
    restart: "no"
    init: true
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ${MTLS_WORK:?set by mtls.sh}/holders:/holders:ro
